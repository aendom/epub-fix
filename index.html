<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>epub-fix</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Fix an EPUB in your browser: replace or repair the cover, edit title, author and series, rename chapters, find and replace text, and download a clean copy that works in Thorium, KOReader, CrossPoint and other readers.">
<style>
/* Fonts ship with the page (fonts/, SIL Open Font License), so nothing loads from a third party. */
@font-face { font-family: "IBM Plex Sans"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/plex-sans-400.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/plex-sans-500.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/plex-sans-700.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 400; font-style: normal; font-display: swap; src: url("fonts/plex-cond-400.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 500; font-style: normal; font-display: swap; src: url("fonts/plex-cond-500.woff2") format("woff2"); }
@font-face { font-family: "IBM Plex Sans Condensed"; font-weight: 700; font-style: normal; font-display: swap; src: url("fonts/plex-cond-700.woff2") format("woff2"); }
/* Same visual language as CrossPoint Calendar and Pages for CrossPoint: ink on grey paper,
   selection shown as an inverted cell, a life-size reader beside the controls. */
:root {
  --paper: #e4e6e1;
  --panel: #f1f2ee;
  --ink: #141516;
  --muted: #5d625b;
  --rule: #c3c7bf;
  --bezel: #2c2e2d;
  --on-ink: #f1f2ee;
  --warn: #8a4b0f;
  --bad: #a3271d;
  --ok: #2f6b3a;
  --focus: #3a6fd8;
  color-scheme: light;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: ui-monospace, "Cascadia Mono", "SF Mono", "SFMono-Regular", Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font: 15px/1.5 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 48px;
  margin: 0;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 28px; }

header { display: grid; gap: 14px; border-bottom: 3px solid var(--ink); padding-bottom: 14px; }
.head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
h1 { font: 700 clamp(30px, 5vw, 44px)/1 var(--f-display); letter-spacing: -0.01em; margin: 0; }
.spec { font: 500 12px/1.4 var(--f-mono); color: var(--muted); margin: 6px 0 0; }
.lead { margin: 0; max-width: 64ch; font-size: 16px; text-wrap: pretty; }
.lang-ui { display: flex; gap: 0; }

main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: start; }
@media (max-width: 860px) {
  main { grid-template-columns: minmax(0, 1fr); gap: 24px; }
  .device-col { order: -1; position: static !important; }
}

/* ---- controls ---- */
.controls { display: grid; gap: 26px; min-width: 0; }
.field { display: grid; gap: 8px; min-width: 0; }
.label { font: 700 11px/1 var(--f-display); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.section { display: grid; gap: 14px; padding-top: 22px; border-top: 1px solid var(--rule); min-width: 0; }
.section > h2 { font: 700 22px/1.1 var(--f-display); margin: 0; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.section > h2 small { font: 500 12px/1.4 var(--f-mono); color: var(--muted); }
.locked .section { display: none; }
.intro { background: var(--panel); border: 1px solid var(--rule); padding: 18px 20px; display: grid; gap: 10px; max-width: 520px; }
.intro h2 { font: 700 18px/1.2 var(--f-display); margin: 0; }
.intro ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.intro p { font-size: 13px; color: var(--muted); margin: 0; }
.controls:not(.locked) .intro { display: none; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1.5px solid var(--ink); width: fit-content; max-width: 100%; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { padding: 8px 16px; font: 500 14px/1.2 var(--f-body); cursor: pointer; user-select: none; border-right: 1.5px solid var(--ink); }
.seg label:last-of-type { border-right: 0; }
.seg input:checked + label { background: var(--ink); color: var(--on-ink); }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 2px; }
.seg label:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.seg input:checked + label:hover { background: var(--ink); }

select, .txt, textarea { font: 500 14px/1.3 var(--f-body); color: var(--ink); background: var(--panel); border: 1.5px solid var(--ink);
  padding: 8px 12px; border-radius: 0; max-width: 100%; width: 100%; }
textarea { min-height: 96px; resize: vertical; font-weight: 400; }
.grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 12px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.hint { font-size: 13px; color: var(--muted); margin: 0; max-width: 62ch; }

.drop { display: grid; gap: 4px; place-items: center; text-align: center; padding: 22px 16px; max-width: 440px;
  border: 1.5px dashed var(--ink); background: var(--panel); cursor: pointer; }
.drop:hover, .drop.over { background: color-mix(in srgb, var(--ink) 8%, var(--panel)); }
.drop:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
.drop input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.drop b { font: 700 16px/1.2 var(--f-display); }
.drop span { font-size: 13px; color: var(--muted); }
.drop.small { padding: 14px 16px; }
.fileinfo { font: 400 13px/1.4 var(--f-mono); margin: 0; overflow-wrap: anywhere; max-width: 440px; }

/* health check */
.checks { list-style: none; margin: 0; padding: 0; display: grid; border: 1.5px solid var(--ink); background: var(--panel); }
.checks li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding: 10px 14px; border-top: 1px solid var(--rule); }
.checks li:first-child { border-top: 0; }
.checks .ico { font: 700 15px/1.35 var(--f-display); text-align: center; }
.checks .ok .ico { color: var(--ok); }
.checks .fix .ico { color: var(--warn); }
.checks .bad .ico { color: var(--bad); }
.checks b { font: 700 14px/1.35 var(--f-body); display: block; }
.checks span { font-size: 13px; color: var(--muted); display: block; }

/* cover */
.cover-row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.cover-row .drop { flex: 1 1 240px; }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; max-width: 440px;
  padding: 14px 16px; font: 700 16px/1.2 var(--f-display); letter-spacing: 0.02em; cursor: pointer;
  border: 1.5px solid var(--ink); background: var(--ink); color: var(--on-ink); text-align: left; }
.btn small { font: 400 12px/1.2 var(--f-mono); opacity: 0.8; letter-spacing: 0; text-align: right; overflow-wrap: anywhere; }
.btn:hover { filter: brightness(1.15); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.mini { padding: 7px 14px; font: 500 14px/1.2 var(--f-body); border: 1.5px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; }
.mini:hover { background: color-mix(in srgb, var(--ink) 8%, transparent); }
.mini.ink { background: var(--ink); color: var(--on-ink); }
.mini.ink:hover { filter: brightness(1.15); background: var(--ink); }
.mini:disabled { opacity: .45; cursor: not-allowed; }

/* table of contents */
.toc { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 420px; overflow: auto; padding-right: 4px; }
.toc li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.toc .txt { padding: 6px 10px; font-weight: 400; }
.toc .where { font: 400 11px/1.2 var(--f-mono); color: var(--muted); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.empty { font-size: 14px; color: var(--muted); margin: 0; padding: 14px; border: 1.5px dashed var(--rule); }

/* find & replace */
.fr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
@media (max-width: 520px) { .fr { grid-template-columns: minmax(0, 1fr); } }
.opts { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; }
.opts label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.opts input { accent-color: var(--ink); width: 16px; height: 16px; }
.hits { list-style: none; margin: 0; padding: 0; display: grid; max-height: 280px; overflow: auto; border: 1px solid var(--rule); background: var(--panel); }
.hits li { padding: 8px 12px; border-top: 1px solid var(--rule); font-size: 13px; }
.hits li:first-child { border-top: 0; }
.hits mark { background: var(--ink); color: var(--on-ink); padding: 0 2px; }
.hits .f { font: 400 11px/1.4 var(--f-mono); color: var(--muted); display: block; }
.count { font: 500 13px/1.4 var(--f-mono); margin: 0; }

.download { display: grid; gap: 12px; }
.changes { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.status { font: 400 13px/1.4 var(--f-mono); color: var(--muted); min-height: 1.4em; margin: 0; max-width: 440px; }

/* ---- device ---- */
.device-col { display: grid; justify-items: center; gap: 12px; position: sticky; top: 20px; }
.device { background: var(--bezel); padding: 22px 18px 46px; border-radius: 22px;
  box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 18px 40px -20px rgba(0,0,0,.45); position: relative; }
.device::after { content: ""; position: absolute; left: 50%; bottom: 17px; width: 46px; height: 6px; margin-left: -23px;
  border-radius: 3px; background: rgba(255,255,255,.14); }
.screen { display: grid; place-items: center; width: min(300px, 64vw); aspect-ratio: 480 / 800; background: #fff; overflow: hidden; position: relative; }
.screen img { width: 100%; height: 100%; object-fit: contain; display: block; }
.screen .none { font: 700 18px/1.25 var(--f-display); color: #9a9e97; text-align: center; padding: 24px; }
.bookmeta { text-align: center; max-width: 320px; display: grid; gap: 2px; }
.bookmeta b { font: 700 17px/1.2 var(--f-display); overflow-wrap: anywhere; }
.bookmeta span { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.caption { font: 400 12px/1.4 var(--f-mono); color: var(--muted); text-align: center; max-width: 320px; overflow-wrap: anywhere; margin: 0; }

footer { font-size: 13px; color: var(--muted); border-top: 1px solid var(--rule); padding-top: 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; }
footer a, .hint a { color: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .btn, .seg label, .mini { transition: background-color .12s, filter .12s; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="head-row">
      <div>
        <h1>epub-fix</h1>
        <p class="spec" data-t="spec">EPUB 2 &amp; 3 · Thorium · KOReader · CrossPoint</p>
      </div>
      <div class="seg lang-ui" role="radiogroup" aria-label="Idioma / Language">
        <input type="radio" name="ui" id="ui-es" value="es"><label for="ui-es">ES</label>
        <input type="radio" name="ui" id="ui-en" value="en"><label for="ui-en">EN</label>
      </div>
    </div>
    <p class="lead" data-t="lead"></p>
  </header>

  <main>
    <section class="controls locked" id="controls" aria-label="Editor">

      <div class="field">
        <span class="label" data-t="file"></span>
        <label class="drop" id="drop">
          <input type="file" id="file" accept=".epub,application/epub+zip">
          <b data-t="dropTitle"></b>
          <span data-t="dropSub"></span>
        </label>
        <p class="fileinfo" id="fileinfo" hidden></p>
      </div>

      <div class="intro">
        <h2 data-t="introTitle"></h2>
        <ul>
          <li data-t="intro1"></li><li data-t="intro2"></li><li data-t="intro3"></li><li data-t="intro4"></li><li data-t="intro5"></li>
        </ul>
        <p data-t="introNote"></p>
      </div>

      <div class="section" id="sec-check">
        <h2><span data-t="checkTitle"></span><small id="checksum"></small></h2>
        <ul class="checks" id="checks"></ul>
      </div>

      <div class="section" id="sec-cover">
        <h2 data-t="coverTitle"></h2>
        <div class="cover-row">
          <label class="drop small" id="coverdrop">
            <input type="file" id="coverfile" accept="image/jpeg,image/png,image/webp,image/gif">
            <b data-t="coverDrop"></b>
            <span data-t="coverSub"></span>
          </label>
        </div>
        <div class="field">
          <span class="label" data-t="optimize"></span>
          <div class="seg" role="radiogroup">
            <input type="radio" name="opt" id="opt-on" value="on"><label for="opt-on" data-t="optOn"></label>
            <input type="radio" name="opt" id="opt-off" value="off"><label for="opt-off" data-t="optOff"></label>
          </div>
          <p class="hint" data-t="optHint"></p>
        </div>
        <div class="btn-row"><button class="mini" type="button" id="coverundo" hidden data-t="coverUndo"></button></div>
      </div>

      <div class="section" id="sec-meta">
        <h2 data-t="metaTitle"></h2>
        <div class="field"><label class="label" for="m-title" data-t="mTitle"></label><input class="txt" id="m-title" autocomplete="off"></div>
        <div class="grid2">
          <div class="field"><label class="label" for="m-author" data-t="mAuthor"></label><input class="txt" id="m-author" autocomplete="off"></div>
          <div class="field"><label class="label" for="m-sort" data-t="mSort"></label><input class="txt" id="m-sort" autocomplete="off"></div>
        </div>
        <p class="hint" data-t="authorHint"></p>
        <div class="grid2">
          <div class="field"><label class="label" for="m-series" data-t="mSeries"></label><input class="txt" id="m-series" autocomplete="off"></div>
          <div class="field"><label class="label" for="m-index" data-t="mIndex"></label><input class="txt" id="m-index" inputmode="decimal" autocomplete="off"></div>
        </div>
        <div class="grid2">
          <div class="field"><label class="label" for="m-publisher" data-t="mPublisher"></label><input class="txt" id="m-publisher" autocomplete="off"></div>
          <div class="field"><label class="label" for="m-date" data-t="mDate"></label><input class="txt" id="m-date" placeholder="1999" autocomplete="off"></div>
        </div>
        <div class="grid2">
          <div class="field"><label class="label" for="m-lang" data-t="mLang"></label>
            <select id="m-lang"></select></div>
          <div class="field"><label class="label" for="m-isbn" data-t="mIsbn"></label><input class="txt" id="m-isbn" autocomplete="off"></div>
        </div>
        <div class="field"><label class="label" for="m-subjects" data-t="mSubjects"></label><input class="txt" id="m-subjects" autocomplete="off"></div>
        <div class="field"><label class="label" for="m-desc" data-t="mDesc"></label><textarea id="m-desc"></textarea></div>
      </div>

      <div class="section" id="sec-toc">
        <h2><span data-t="tocTitle"></span><small id="tocsum"></small></h2>
        <ol class="toc" id="toc"></ol>
        <p class="empty" id="tocempty" data-t="tocEmpty" hidden></p>
        <div class="btn-row"><button class="mini" type="button" id="tocgen" data-t="tocGen"></button></div>
        <p class="hint" data-t="tocHint"></p>
      </div>

      <div class="section" id="sec-find">
        <h2 data-t="findTitle"></h2>
        <div class="fr">
          <div class="field"><label class="label" for="f-find" data-t="fFind"></label><input class="txt" id="f-find" autocomplete="off" spellcheck="false"></div>
          <div class="field"><label class="label" for="f-repl" data-t="fRepl"></label><input class="txt" id="f-repl" autocomplete="off" spellcheck="false"></div>
        </div>
        <div class="opts">
          <label><input type="checkbox" id="f-case"><span data-t="fCase"></span></label>
          <label><input type="checkbox" id="f-word"><span data-t="fWord"></span></label>
          <label><input type="checkbox" id="f-re"><span data-t="fRe"></span></label>
        </div>
        <div class="btn-row">
          <button class="mini" type="button" id="f-go" data-t="fGo"></button>
          <button class="mini ink" type="button" id="f-all" data-t="fAll" disabled></button>
        </div>
        <p class="count" id="f-count" hidden></p>
        <ul class="hits" id="f-hits" hidden></ul>
        <p class="hint" data-t="findHint"></p>
      </div>

      <div class="section download" id="sec-out">
        <h2 data-t="outTitle"></h2>
        <div class="field">
          <span class="label" data-t="fmt"></span>
          <div class="seg" role="radiogroup">
            <input type="radio" name="fmt" id="fmt-hybrid" value="hybrid"><label for="fmt-hybrid" data-t="fmtHybrid"></label>
            <input type="radio" name="fmt" id="fmt-keep" value="keep"><label for="fmt-keep" data-t="fmtKeep"></label>
          </div>
          <p class="hint" id="fmthint"></p>
        </div>
        <ul class="changes" id="changes"></ul>
        <button class="btn" id="go" type="button" disabled><span data-t="go"></span><small id="outname"></small></button>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <div class="device-col">
      <div class="device"><div class="screen" id="screen"><div class="none" id="nocover"></div><img id="coverimg" alt="" hidden></div></div>
      <div class="bookmeta"><b id="bm-title"></b><span id="bm-author"></span></div>
      <p class="caption" id="caption"></p>
    </div>
  </main>

  <footer>
    <span data-t="foot"></span>
    <a href="https://github.com/aendom/epub-fix" target="_blank" rel="noopener">github.com/aendom/epub-fix</a>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------- text
const UI = {
  en: {
    spec: "EPUB 2 &amp; 3 · Thorium · KOReader · CrossPoint",
    lead: "Fix an ebook that came out wrong: replace or repair the cover, correct the title and author, rename chapters, fix misspelled text, and download a clean copy that opens well in any reader. Everything happens in your browser; the book is never uploaded.",
    file: "Book", dropTitle: "Drop an EPUB here", dropSub: "or click to choose a file. It stays on your computer.",
    checkTitle: "Check", coverTitle: "Cover", metaTitle: "Details", tocTitle: "Chapters", findTitle: "Find and replace", outTitle: "Download",
    coverDrop: "Drop a new cover image", coverSub: "JPG, PNG or WebP. Portrait works best.",
    optimize: "Cover image", optOn: "Optimize", optOff: "Use as is",
    optHint: "Optimize saves it as a JPG no taller than 1600 px: sharp on any reader and light on small devices.",
    coverUndo: "Undo new cover",
    mTitle: "Title", mAuthor: "Author", mSort: "Sort as", mSeries: "Series", mIndex: "Number",
    mPublisher: "Publisher", mDate: "Year or date", mLang: "Language", mIsbn: "ISBN / identifier",
    mSubjects: "Tags, separated by commas", mDesc: "Description",
    authorHint: "Separate several authors with &amp;. Sort as is how libraries order the book, for example <i>Cortázar, Julio</i>.",
    tocEmpty: "This book has no table of contents.",
    tocGen: "Build from chapter headings",
    tocHint: "Rename entries here; the change goes into both kinds of table of contents, so every reader shows it. Building from headings replaces the list with one entry per chapter file.",
    fFind: "Find", fRepl: "Replace with", fCase: "Match case", fWord: "Whole words", fRe: "Pattern (regex)",
    fGo: "Find", fAll: "Replace all",
    findHint: "Searches the text of every chapter, never the code around it. A phrase broken by formatting (half in italics, for example) won't be found.",
    fmt: "Format", fmtHybrid: "EPUB 3 + EPUB 2 (recommended)", fmtKeep: "Keep the original version",
    go: "Download fixed EPUB",
    foot: "Made by AENDOM. Works with any EPUB reader.",
    noBook: "No book yet", noCover: "This book has no cover",
    // checks
    ckCoverOk: "Cover", ckCoverOkD: "Found and declared so every reader can show it.",
    ckCoverFix: "Cover not declared for every reader", ckCoverFixD: "Some readers won't show it. Fixed on download.",
    ckCoverBad: "No cover", ckCoverBadD: "Drop an image in Cover to add one.",
    ckCoverNew: "New cover", ckCoverNewD: "Will be added and declared for every reader.",
    ckTocOk: (n) => `Table of contents · ${n} entries`, ckTocOkD: "Present in both formats.",

    ckTocFew: (n) => `Table of contents · only ${n} ${n === 1 ? "entry" : "entries"}`, ckTocFewD: "Probably incomplete. Check Chapters.",
    ckLangOk: (l) => `Language · ${l}`, ckLangOkD: "Readers use it to pick hyphenation and dictionary.",

    ckLangFix: (l) => `Language code “${l}” is not standard`, ckLangFixD: (l) => `Will be saved as “${l}”.`,
    ckMetaOk: "Title and author", ckMetaOkD: "Both present.",
    ckMetaBad: "Title or author missing", ckMetaBadD: "Fill them in Details so the book shows correctly in your library.",

    const um = !broken(d) && byLocal(d, "meta").find(e => e.getAttribute("name") === "dtb:uid");
    if (um && um.getAttribute("content") !== uid) { um.setAttribute("content", uid); files.set(ncxPath, serialize(d)); }
  }
  if (v3) {
    if (b.navItem && b.zip.file(b.navItem.path)) {
      if (tocChanged) {
        // rewrite only the toc <nav>, keep landmarks / page-list
        const src = await b.zip.file(b.navItem.path).async("string");
        const d = parseXML(src);
        const fresh = parseXML(navXhtml(b, b.navItem.path, toc, lang));
        const nav = !broken(d) && byLocal(d, "nav").find(n => (n.getAttributeNS(NS.ops, "type") || "").split(/\s+/).includes("toc"));
        const newNav = byLocal(fresh, "nav")[0];
        if (nav) { nav.parentNode.replaceChild(d.importNode(newNav, true), nav); files.set(b.navItem.path, serialize(d)); }
        else files.set(b.navItem.path, navXhtml(b, b.navItem.path, toc, lang));
      }
    } else {
      const navPath = uniquePath(b, opfDir + "nav.xhtml");
      const id = uniqueId(b, "nav");
      const e = doc.createElementNS(NS.opf, "item"); e.setAttribute("id", id); e.setAttribute("href", toHref(navPath));
      e.setAttribute("media-type", "application/xhtml+xml"); e.setAttribute("properties", "nav");
      b.manifestEl.appendChild(e);
      files.set(navPath, navXhtml(b, navPath, toc, lang));
    }
  }

  // EPUB 3 manifest properties that epubcheck and strict readers expect on content documents
  if (v3) {
    for (const e of byLocal(b.manifestEl, "item")) {
      if (e.getAttribute("media-type") !== "application/xhtml+xml") continue;
      const p = resolve(b.opfPath, e.getAttribute("href"));
      const src = files.has(p) ? files.get(p) : (book.edits[p] != null ? book.edits[p] : (b.zip.file(p) ? await b.zip.file(p).async("string") : ""));
      const props = new Set((e.getAttribute("properties") || "").split(/\s+/).filter(Boolean));
      ["svg", "scripted", "remote-resources"].forEach(x => props.delete(x));
      if (/<svg[\s>]/i.test(src)) props.add("svg");
      if (/<script[\s>]/i.test(src)) props.add("scripted");
      if (/(src|href)\s*=\s*["']https?:/i.test(src.replace(/<a\s[^>]*>/gi, ""))) props.add("remote-resources");
      if (props.size) e.setAttribute("properties", Array.from(props).join(" ")); else e.removeAttribute("properties");
    }
  }

  // ---- write the zip: mimetype first, stored
  const out = new JSZip();
  out.file("mimetype", "application/epub+zip", { compression: "STORE" });
  out.file("META-INF/container.xml", `<?xml version="1.0" encoding="utf-8"?>
<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="${esc(b.opfPath)}" media-type="application/oebps-package+xml"/></rootfiles></container>`);
  // EPUB 2 chapters inside an EPUB 3 package: modernise the two header lines EPUB 3 rejects.
  const upgrade = b.version === 2 && v3;
  const xhtmlPaths = new Set(byLocal(b.manifestEl, "item").filter(e => e.getAttribute("media-type") === "application/xhtml+xml").map(e => resolve(b.opfPath, e.getAttribute("href"))));
  const modernise = (s) => s
    .replace(/<!DOCTYPE\s+html\s+PUBLIC[^>]*>/i, "<!DOCTYPE html>")
    .replace(/<meta\s+[^>]*http-equiv\s*=\s*["']content-type["'][^>]*>/gi, '<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>');
  for (const [p, f] of Object.entries(b.zip.files)) {
    if (f.dir || p === "mimetype" || p === "META-INF/container.xml" || p === b.opfPath || p.startsWith("__MACOSX/") || /(^|\/)(\.DS_Store|Thumbs\.db)$/.test(p)) continue;
    if (files.has(p)) continue;
    if (upgrade && xhtmlPaths.has(p)) { out.file(p, modernise(book.edits[p] != null ? book.edits[p] : await f.async("string"))); continue; }
    if (book.edits[p] != null) { out.file(p, book.edits[p]); continue; }
    const store = /\.(jpe?g|png|gif|webp|woff2?|mp3|mp4)$/i.test(p);
    out.file(p, await f.async("uint8array"), { compression: store ? "STORE" : "DEFLATE" });
  }
  for (const [p, data] of files) out.file(p, data);
  out.file(b.opfPath, serialize(doc).replace(/>\s*\n(\s*\n)+/g, ">\n").replace(/><(dc:|meta |\/metadata)/g, ">\n    <$1"));
  return out.generateAsync({ type: "blob", mimeType: "application/epub+zip", compression: "DEFLATE", compressionOptions: { level: 9 } });
}

// ---------------------------------------------------------------- UI: current values
const FIELDS = ["title", "author", "sort", "series", "index", "publisher", "date", "lang", "isbn", "subjects", "desc"];
function currentMeta() {
  const m = {};
  for (const k of FIELDS) m[k] = ($("#m-" + k).value || "").trim();
  return m;
}
function currentToc() {
  return book.toc.map((e, i) => ({ ...e, label: ($(`#toc-${i}`) ? $(`#toc-${i}`).value : e.label).trim() }));
}
function fillMeta() {
  const m = book.meta;
  for (const k of FIELDS) if (k !== "lang") $("#m-" + k).value = m[k] || "";
  $("#m-sort").placeholder = sortName(m.author);
  fillLang(normLang(m.lang));
}
function fillLang(code) {
  const sel = $("#m-lang");
  const list = LANGS.slice();
  if (code && !list.some(([c]) => c === code)) list.unshift([code, code]);
  sel.innerHTML = `<option value="">—</option>` + list.map(([c, n]) => `<option value="${esc(c)}">${esc(n)} · ${esc(c)}</option>`).join("");
  sel.value = code || "";
}
function renderToc() {
  const ol = $("#toc");
  ol.innerHTML = book.toc.map((e, i) => `<li style="padding-left:${Math.min(e.depth, 4) * 18}px"><input class="txt" id="toc-${i}" value="${esc(e.label)}" aria-label="${i + 1}"><span class="where" title="${esc(e.href)}">${esc((e.href || "").split("/").pop())}</span></li>`).join("");
  $("#tocempty").hidden = book.toc.length > 0;
  $("#tocsum").textContent = book.toc.length ? t("entries")(book.toc.length) : "";
}
function renderCover() {
  const img = $("#coverimg");
  const url = book && (book.newCover ? book.newCover.url : book.coverURL);
  img.hidden = !url; if (url) img.src = url;
  $("#nocover").hidden = !!url;
  $("#nocover").textContent = book ? t("noCover") : t("noBook");
  const m = book ? currentMeta() : null;
  $("#bm-title").textContent = m ? m.title : "";
  $("#bm-author").textContent = m ? m.author : "";
  let cap = "";
  if (book && book.newCover) cap = `${t("coverNew")} · ${t("coverInfo")(book.newCover.w, book.newCover.h, bytes(book.newCover.data.length))}`;
  else if (book && book.coverDims) cap = `${t("coverOrig")} · ${t("coverInfo")(book.coverDims.w, book.coverDims.h, bytes(book.coverDims.size))}`;
  $("#caption").textContent = cap;
  $("#coverundo").hidden = !(book && book.newCover);
}
function checkRow(kind, title, detail) {
  const ico = kind === "ok" ? "✓" : kind === "fix" ? "!" : "✕";
  return `<li class="${kind}"><span class="ico" aria-hidden="true">${ico}</span><div><b>${title}</b><span>${detail}</span></div></li>`;
}
function renderChecks() {
  if (!book) return;
  const b = book, rows = [], m = currentMeta();
  let toFix = 0;
  // cover
  if (b.newCover) rows.push(checkRow("ok", t("ckCoverNew"), t("ckCoverNewD")));
  else if (!b.cover) { rows.push(checkRow("bad", t("ckCoverBad"), t("ckCoverBadD"))); toFix++; }
  else if (!b.coverDeclared || (state.fmt === "hybrid" && !b.cover.props.includes("cover-image"))) { rows.push(checkRow("fix", t("ckCoverFix"), t("ckCoverFixD"))); toFix++; }
  else rows.push(checkRow("ok", t("ckCoverOk"), t("ckCoverOkD")));
  // toc
  const n = b.toc.length;
  if (!n) { rows.push(checkRow("bad", t("ckTocBad"), t("ckTocBadD"))); toFix++; }
  else if (b.spine.length > 6 && n < b.spine.length / 3) { rows.push(checkRow("fix", t("ckTocFew")(n), t("ckTocFewD"))); toFix++; }
  else if (!b.hasNcx || (!b.hasNav && state.fmt === "hybrid")) { rows.push(checkRow("fix", t("ckTocFix")(n), t("ckTocFixD")(b.hasNav ? "EPUB 3" : "EPUB 2"))); toFix++; }
  else rows.push(checkRow("ok", t("ckTocOk")(n), t("ckTocOkD")));
  // language
  const lang = m.lang;
  if (!lang) { rows.push(checkRow("bad", t("ckLangBad"), t("ckLangBadD"))); toFix++; }
  else if (b.meta.lang && normLang(b.meta.lang) !== b.meta.lang && lang === normLang(b.meta.lang)) { rows.push(checkRow("fix", t("ckLangFix")(b.meta.lang), t("ckLangFixD")(lang))); toFix++; }
  else rows.push(checkRow("ok", t("ckLangOk")(lang), t("ckLangOkD")));
  // title / author
  if (!m.title || !m.author) { rows.push(checkRow("bad", t("ckMetaBad"), t("ckMetaBadD"))); toFix++; }
  else rows.push(checkRow("ok", t("ckMetaOk"), t("ckMetaOkD")));
  // files
  const list = (a) => esc(a.slice(0, 4).join(", ") + (a.length > 4 ? "…" : ""));
  if (b.missing.length) { rows.push(checkRow("fix", t("ckMissing")(b.missing.length), t("ckMissingD")(list(b.missing)))); toFix++; }
  if (b.extra.length) { rows.push(checkRow("fix", t("ckExtra")(b.extra.length), t("ckExtraD")(list(b.extra)))); toFix++; }
  if (!b.missing.length && !b.extra.length) rows.push(checkRow("ok", t("ckFilesOk")(b.items.length), t("ckFilesOkD")));
  if (!b.packOk) { rows.push(checkRow("fix", t("ckPackFix"), t("ckPackFixD"))); toFix++; }
  else rows.push(checkRow("ok", t("ckPackOk"), t("ckPackOkD")));
  if (b.brokenDocs) rows.push(checkRow("fix", t("ckBroken")(b.brokenDocs), t("ckBrokenD")));
  $("#checks").innerHTML = rows.join("");
  $("#checksum").textContent = t("ckSum")(rows.length, toFix);
}
function renderChanges() {
  if (!book) { $("#changes").innerHTML = ""; return; }
  const b = book, c = [];
  const hybrid = state.fmt === "hybrid";
  if (b.newCover) c.push(t("chCover"));
  else if (b.cover && (!b.coverDeclared || (hybrid && !b.cover.props.includes("cover-image")) || !b.coverPage)) c.push(t("chCoverDecl"));
  if (JSON.stringify(currentMeta()) !== b.metaOrig) c.push(t("chMeta"));
  if (b.tocBuilt) c.push(t("chTocNew"));
  else if (b.toc.length && JSON.stringify(currentToc().map(e => e.label)) !== b.tocOrig) c.push(t("chToc"));
  if (b.replaced) c.push(t("chText")(b.replaced));
  if (hybrid && b.version === 2) c.push(t("chHybrid"));
  else if (hybrid && !b.hasNav) c.push(t("chNav"));
  if (!b.hasNcx && b.toc.length) c.push(t("chNcx"));
  if (b.missing.length || b.extra.length) c.push(t("chFiles"));
  if (!b.packOk) c.push(t("chPack"));
  if (!c.length) c.push(t("chNone"));
  $("#changes").innerHTML = `<li style="list-style:none;margin-left:-18px">${t("chHead")}</li>` + c.map(s => `<li>${esc(s)}</li>`).join("");
  $("#fmthint").textContent = b.version === 2 ? t("fmtHint2") : t("fmtHint3");
}
function outName() {
  if (!book) return "";
  const m = currentMeta();
  const base = [m.title, m.author.split("&")[0].trim()].filter(Boolean).join(" - ") || book.file.name.replace(/\.epub$/i, "");
  return base.normalize("NFC").replace(/[\\/:*?"<>|]+/g, " ").replace(/\s+/g, " ").trim().slice(0, 140) + ".epub";
}
function refreshAll() {
  renderChecks(); renderChanges(); renderCover();
  $("#outname").textContent = outName();
}

// ---------------------------------------------------------------- delivery
let dlApi;
const inViewer = !!(window.claude && window.claude.use);
const viewerReady = inViewer ? window.claude.use("downloads").then(d => (dlApi = d)).catch(() => null) : Promise.resolve(null);
async function deliver(name, blob) {
  await viewerReady;
  if (dlApi) {
    const z = new JSZip(); z.file(name, blob, { compression: "STORE" });
    const zb = await z.generateAsync({ type: "blob" });
    const n = name.replace(/\.epub$/i, ".zip");
    try { await dlApi.save({ filename: n, data: zb }); say(t("done")(n) + " · " + t("zipped")); }
    catch (e) { say(e && e.code === "declined" ? t("declined") : t("failed") + (e && e.message || e)); }
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
  say(t("done")(name));
}
function say(s) { $("#status").textContent = s; }

// ---------------------------------------------------------------- wiring
async function loadFile(file) {
  if (!file) return;
  if (!window.JSZip) { say(t("noLib")); return; }
  say(t("reading"));
  try {
    if (book && book.coverURL) URL.revokeObjectURL(book.coverURL);
    book = await openEpub(file);
    if (book.coverURL) {
      try { const bm = await createImageBitmap(await (await fetch(book.coverURL)).blob()); book.coverDims = { w: bm.width, h: bm.height, size: (await book.zip.file(book.cover.path).async("uint8array")).length }; } catch (e) {}
    }
  } catch (e) {
    console.error(e); book = null; say(t("notEpub")); $("#controls").classList.add("locked"); renderCover(); return;
  }
  $("#controls").classList.remove("locked");
  $("#fileinfo").hidden = false;
  $("#fileinfo").textContent = t("fileinfo")(file.name, bytes(file.size), book.version, book.spine.length);
  fillMeta(); renderToc();
  book.metaOrig = JSON.stringify(currentMeta());
  $("#f-hits").hidden = true; showCount(""); $("#f-all").disabled = true;
  $("#go").disabled = false;
  say("");
  refreshAll();
}
function wireDrop(el, input, handler) {
  input.addEventListener("change", () => { handler(input.files[0]); input.value = ""; });
  el.addEventListener("dragover", (e) => { e.preventDefault(); el.classList.add("over"); });
  el.addEventListener("dragleave", () => el.classList.remove("over"));
  el.addEventListener("drop", (e) => { e.preventDefault(); el.classList.remove("over"); handler(e.dataTransfer.files[0]); });
}
wireDrop($("#drop"), $("#file"), loadFile);
wireDrop($("#coverdrop"), $("#coverfile"), async (file) => {
  if (!book || !file || !/^image\//.test(file.type)) return;
  try {
    const c = await prepareCover(file);
    if (book.newCover && book.newCover.url) URL.revokeObjectURL(book.newCover.url);
    c.url = URL.createObjectURL(new Blob([c.data], { type: c.type }));
    c.source = file;
    book.newCover = c;
    refreshAll();
  } catch (e) { say(t("failed") + (e.message || e)); }
});
$("#coverundo").addEventListener("click", () => { if (book && book.newCover) { URL.revokeObjectURL(book.newCover.url); book.newCover = null; refreshAll(); } });
$("#tocgen").addEventListener("click", async () => {
  if (!book) return;
  const list = await buildTocFromHeadings(book);
  if (!list.length) return;
  book.toc = list; book.tocBuilt = true;
  renderToc(); refreshAll();
});
$("#toc").addEventListener("input", () => { if (book) { book.tocDirty = true; renderChanges(); } });
FIELDS.forEach(k => $("#m-" + k).addEventListener("input", () => {
  if (k === "author") $("#m-sort").placeholder = sortName($("#m-author").value);
  if (book) { book.metaChanged = true; refreshAll(); }
}));
$("#m-lang").addEventListener("change", () => { if (book) { book.metaChanged = true; refreshAll(); } });
$("#f-go").addEventListener("click", () => find(false));
$("#f-all").addEventListener("click", () => find(true));
$("#f-find").addEventListener("keydown", (e) => { if (e.key === "Enter") find(false); });
["#f-find", "#f-case", "#f-word", "#f-re"].forEach(s => $(s).addEventListener("input", () => { $("#f-all").disabled = true; }));
$("#go").addEventListener("click", async () => {
  if (!book) return;
  $("#go").disabled = true; say(t("building"));
  try {
    // keep the sort field honest: if left empty, use the suggestion
    if (!$("#m-sort").value.trim()) $("#m-sort").value = sortName($("#m-author").value);
    const blob = await buildEpub();
    await deliver(outName(), blob);
  } catch (e) { console.error(e); say(t("failed") + (e.message || e)); }
  $("#go").disabled = false;
});

function check(name, value) { const el = document.querySelector(`input[name="${name}"][value="${value}"]`); if (el) el.checked = true; }
function applyUI() {
  document.documentElement.lang = state.ui;
  document.querySelectorAll("[data-t]").forEach(el => { const v = t(el.dataset.t); if (typeof v === "string") el.innerHTML = v; });
  ["ui", "opt", "fmt"].forEach(k => check(k, state[k]));
  if (book) { $("#fileinfo").textContent = t("fileinfo")(book.file.name, bytes(book.file.size), book.version, book.spine.length); renderToc(); }
  else fillLang("");
  refreshAll();
}
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.name === "ui") { state.ui = el.value; persist(); applyUI(); }
  if (el.name === "opt") { state.opt = el.value; persist(); if (book && book.newCover) prepareCover(book.newCover.source).then(c => { URL.revokeObjectURL(book.newCover.url); c.url = URL.createObjectURL(new Blob([c.data], { type: c.type })); c.source = book.newCover.source; book.newCover = c; refreshAll(); }); }
  if (el.name === "fmt") { state.fmt = el.value; persist(); refreshAll(); }
});
applyUI();
if (!window.JSZip) say(t("noLib"));
// test hook
window.__epubfix = { get book() { return book; }, buildEpub, loadFile };
</script>
</body>
